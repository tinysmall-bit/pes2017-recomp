# Android debug APK with the career trace (PES 2017, Xbox 360 -> arm64).
#
# This runs on a GitHub-hosted ubuntu-24.04 runner, so no PC and no self-hosted
# machine is needed. The build input is still your own retail default.xex, and it
# must not land in this repository, so:
#
#   * it is downloaded at run time from the URL in the PES17_XEX_URL secret,
#     into $RUNNER_TEMP (outside the checkout), and the job stops unless its
#     SHA-256 is the Europe retail hash the app already expects;
#   * nothing game-derived is committed or cached: no default.xex, no decrypted
#     pes/default.pe, no ppc/ sources, no game files. The "Never commit the game"
#     step fails the run if any of them would be picked up by git, and the final
#     cleanup step deletes them (the runner is thrown away either way);
#   * the APK is NOT a workflow artifact. It is uploaded to your own Dropbox by
#     the "Deliver the APK to Dropbox" step, using a Dropbox app credential with
#     only the files.content.write scope. No public link is created.
#
# Trigger: workflow_dispatch only. Nothing here runs on a push or a pull request.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   PES17_XEX_URL               Dropbox link to the Europe retail default.xex.
#                               Use a link ending in ?dl=1 (a ?dl=0 link is
#                               rewritten to ?dl=1); the URL is never printed.
#   PES17_DROPBOX_APP_KEY       Dropbox app's App key
#   PES17_DROPBOX_APP_SECRET    Dropbox app's App secret
#   PES17_DROPBOX_REFRESH_TOKEN refresh token for that app with offline access
#
# The Dropbox app (dropbox.com/developers/apps) needs exactly one permission,
# files.content.write -- not full Dropbox access -- and the refresh token is
# generated once with the "No expiration unless revoked" option. If the app is
# created with the "App folder" access type instead of "Full Dropbox", set the
# repository variable PES17_DROPBOX_DIR to a path inside that app folder.
#
# Repository variable (optional):
#   PES17_DROPBOX_DIR           destination folder, default /PES17-Builds
#
# The APK is built with diagnostics ON because career_trace::On() is
# `diag::kOn && ...` (runtime/kernel/career_trace.cpp): with
# -DPES17_DIAGNOSTICS=OFF the PES17_TRACE_CAREER switch is compiled out and
# setting it does nothing. This is a tracing build, not a performance build.
#
# Two stages on purpose: build.sh generates ppc/ from the xex and
# RECOMPILE_ONLY=1 stops before its own native build; Gradle then runs the one
# native build whose libpes17.so is packaged, so the checks afterwards read
# exactly the library that is in the APK. Compiling it twice would waste hours
# and could verify a different binary from the shipped one.
#
# libadrenotools (third_party/libadrenotools, android/fetch_deps.sh) is not
# fetched here. cmake/android.cmake makes it optional, and a tracing build does
# not need a swapped driver.
name: Android debug APK (career trace)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  apk:
    # GitHub-hosted, not self-hosted: a public repository must never accept a
    # job from a runner it does not control.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # The Europe retail default.xex. The app's installer checks this same hash
      # (android/app/build.gradle.kts), so another region's dump would build an
      # APK that refuses the player's own disc.
      EXPECTED_XEX_SHA: b914ec9a1abb3a9b42a64255b6aa8ff27312da126f7c18f8c880106b832779e6
      # Free space the job insists on; see "Check disk space" below.
      MIN_FREE_GIB: '30'
      PROFILE: balanced
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Check out fix1
        uses: actions/checkout@v4
        with:
          ref: fix1
          fetch-depth: 0
          clean: true

      - name: Free the disk a hosted runner does not give you
        run: |
          set -euo pipefail
          echo 'before:'
          df -h / "$RUNNER_TEMP" | sed 's/^/  /'
          # The image ships ~15 GB free on a 72 GB disk, and the recompiled tree
          # needs more than that. None of this is used by this job.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /opt/az \
            /opt/microsoft \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/sources \
            /usr/local/lib/android/sdk/ndk \
            /usr/lib/jvm
          sudo apt-get clean
          docker image prune -af >/dev/null 2>&1 || true
          echo 'after:'
          df -h / "$RUNNER_TEMP" | sed 's/^/  /'

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK 28.2 and CMake 3.22.1
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          [ -d "$sdk" ] || fail "No Android SDK at $sdk on this image."

          sm=$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)
          [ -n "$sm" ] || fail "No sdkmanager under $sdk/cmdline-tools."

          yes | "$sm" --licenses >/dev/null 2>&1 || true
          # The library is aligned for 16 KB pages, which is what r27+ does by
          # default; Gradle asks for exactly this NDK version.
          "$sm" --install "ndk;28.2.13676358" "cmake;3.22.1" \
                           "platforms;android-35" "build-tools;35.0.0"

          ndk="$sdk/ndk/28.2.13676358"
          [ -d "$ndk" ] || fail "NDK 28.2.13676358 is not in $sdk/ndk after installing it."

          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"
          echo "SDK: $sdk"
          echo "NDK: $ndk"

      - name: Check the hosted toolchain and record the build identity
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          for t in git cmake ninja python3 unzip java curl; do
            command -v "$t" >/dev/null 2>&1 || fail "$t is not on PATH."
          done
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache || fail "ccache could not be installed."
          fi
          echo "ccache: $(ccache --version | head -1)"

          clang_bin=$(command -v clang || true)
          [ -n "$clang_bin" ] && [ -x "$clang_bin" ] || fail "clang is not available."
          cxx_bin=$(command -v clang++ || true)
          [ -n "$cxx_bin" ] && [ -x "$cxx_bin" ] || fail "clang++ is not available."

          jv=$(java -version 2>&1 | awk -F'"' '/version/ { print $2; exit }')
          jmaj=$(printf '%s' "${jv:-0}" | awk -F. '{ print ($1 == "1") ? $2 : $1 }')
          [ "${jmaj:-0}" -ge 17 ] 2>/dev/null || fail "JDK 17+ is required; java is '${jv:-missing}' (AGP 8.7 / Gradle 8.11)."

          cmake --version | head -1
          python3 --version
          nproc

          {
            # PES17_GAME and CCACHE_DIR are set here rather than at job level:
            # the runner context is not available in jobs.<job_id>.env. Both
            # live under RUNNER_TEMP, outside the checkout, so no game file and
            # no cache directory can be mistaken for a commit candidate.
            echo "PES17_GAME=$RUNNER_TEMP/pes17-game"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CMAKE_CC=$clang_bin"
            echo "CMAKE_CXX=$cxx_bin"
            echo "PES17_BUILD_SHA=$(git rev-parse --short HEAD)"
            echo "PES17_BUILD_STAMP=$(date -u +%Y%m%dT%H%M%SZ)"
            echo "JOBS=$(nproc)"
          } >> "$GITHUB_ENV"

          echo "APK will be: android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Download default.xex from the secret URL and verify it
        env:
          PES17_XEX_URL: ${{ secrets.PES17_XEX_URL }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ -n "${PES17_XEX_URL:-}" ] || fail \
            "The PES17_XEX_URL secret is empty. Add the Dropbox link to the Europe retail default.xex (a ?dl=1 link) under Settings > Secrets and variables > Actions."

          mkdir -p "$PES17_GAME"
          xex="$PES17_GAME/default.xex"

          # A ?dl=0 link serves the Dropbox web page, not the file.
          url=$PES17_XEX_URL
          case $url in *dl=0*) url=${url/dl=0/dl=1} ;; esac

          echo "Downloading default.xex from the PES17_XEX_URL secret (the URL is not printed)."
          curl -fSL --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
               -o "$xex.part" "$url" \
            || fail "The download failed. Check that the Dropbox link still works and ends in ?dl=1."
          mv "$xex.part" "$xex"

          size=$(wc -c < "$xex")
          echo "downloaded: $size bytes"
          [ "$size" -gt 50000000 ] || fail "The download is only $size bytes -- that is not default.xex."

          magic=$(head -c 4 "$xex" || true)
          [ "$magic" = XEX2 ] || fail \
            "The download is not an Xbox 360 executable (magic '$magic'): a Dropbox page or an error page was saved instead of default.xex."

          got=$(sha256sum "$xex" | cut -d' ' -f1)
          echo "SHA-256: $got"
          if [ "$got" != "$EXPECTED_XEX_SHA" ]; then
            fail "This is not the Europe retail default.xex: got $got, expected $EXPECTED_XEX_SHA. Get the Europe (BLES/PAL) retail dump; another region will not match the hash the app installs against."
          fi
          echo "verified: Europe retail default.xex"

      - name: Check the three career commits are in HEAD
        run: |
          set -euo pipefail
          echo "HEAD: $(git rev-parse HEAD)"
          for c in 29fd9ca 70eabb6 76b0255; do
            git cat-file -e "${c}^{commit}" 2>/dev/null || { echo "::error::commit $c is not in this clone"; exit 1; }
            git merge-base --is-ancestor "$c" HEAD || { echo "::error::commit $c is not an ancestor of HEAD"; exit 1; }
            echo "ok: $(git log -1 --format='%h %s' "$c")"
          done

      - name: Cache the host tools, ccache and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ccache
            ~/.gradle/caches
            ~/.gradle/wrapper
            third_party/XenonRecomp/build
          # No game-derived cache: pes/default.pe, pes/default.xex and ppc/ are
          # rebuilt from the secret download on every run.
          key: pes17-hosted-${{ env.EXPECTED_XEX_SHA }}-${{ hashFiles('build.sh', 'config/PES.toml', 'config/pes_switch_extra.toml', 'CMakeLists.txt', 'android/app/build.gradle.kts', 'third_party/XenonRecomp/CMakeLists.txt') }}
          restore-keys: |
            pes17-hosted-${{ env.EXPECTED_XEX_SHA }}-

      - name: Check disk space before recompilation
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          echo 'disk space:'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | sed 's/^/  /'
          for d in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            avail_kb=$(df -Pk "$d" | awk 'NR == 2 { print $4 }')
            avail_gib=$(( avail_kb / 1024 / 1024 ))
            echo "$d: ${avail_gib} GiB free"
            [ "$avail_gib" -ge "$MIN_FREE_GIB" ] || fail \
              "Only ${avail_gib} GiB free on $d; the recompilation needs at least ${MIN_FREE_GIB} GiB for the generated C++, its objects and libpes17.so. Harden the disk cleanup step or lower MIN_FREE_GIB deliberately."
          done

      - name: Generate ppc/ from default.xex
        run: |
          set -euo pipefail
          chmod +x build.sh tools/verify_android_libs.sh
          CCACHE=1 RECOMPILE_ONLY=1 GAME="$PES17_GAME" ./build.sh
          echo "ppc/: $(ls ppc | wc -l) files"
          ls ppc/ppc_recomp.*.cpp >/dev/null 2>&1 || { echo "::error::ppc/ has no recompiled units"; exit 1; }
          [ -f ppc/stubs_generated.cpp ] || { echo "::error::ppc/stubs_generated.cpp is missing"; exit 1; }
          ls -la ppc/PROFILE pes/default.xex

      - name: Never commit the game
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          # The checkout must stay clean of everything derived from the disc:
          # default.xex, decrypt output, ppc/ sources and the analyser logs.
          for p in pes/default.xex pes/default.pe; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              fail "$p is tracked by git; game files must never be committed."
            fi
          done
          if git ls-files --error-unmatch 'ppc/*' >/dev/null 2>&1; then
            fail "ppc/ is tracked by git; generated recompilation output must never be committed."
          fi

          untracked=$(git status --porcelain --untracked-files=all | grep '^??' || true)
          if [ -n "$untracked" ]; then
            echo "::error::untracked files would be commit candidates:"
            printf '%s\n' "$untracked"
            exit 1
          fi
          echo "ok: no game file or generated source is visible to git"

      - name: Career-trace checks (no disc, no device)
        run: |
          set -euo pipefail
          cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests --target career-trace-test -j"$JOBS"
          ctest --test-dir build-tests -R '^career-trace$' --output-on-failure
          python3 tools/career/test_career_tools.py
          python3 tools/career/test_career_analysis.py

      - name: Build libpes17.so and app-debug.apk
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          # The trace is compiled out without diagnostics (see the header comment).
          export PES17_DIAGNOSTICS=ON
          # -O2 compiles the recompiled tree noticeably faster than -O3 and runs
          # within a few percent of it (android/app/build.gradle.kts); four cores
          # is what a hosted runner has.
          export PES17_NATIVE_OPTIMISATION=-O2
          export PES17_COMPILER_LAUNCHER=ccache
          export CMAKE_BUILD_PARALLEL_LEVEL="$JOBS"
          # Above release 0.2.0's versionCode 40. The debug key still cannot
          # install over a release-signed copy (different signature).
          export PES17_VERSION_CODE=41
          export PES17_VERSION_NAME=0.2.0-trace
          cd android
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify the APK
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          apk=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$apk" ] || fail "Gradle produced no $apk"
          ls -la "$apk"

          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libpes17\.so' || fail "the APK has no lib/arm64-v8a/libpes17.so"

          rm -rf verify-apk && mkdir -p verify-apk
          unzip -q "$apk" 'lib/arm64-v8a/*' -d verify-apk
          lib=verify-apk/lib/arm64-v8a/libpes17.so
          size=$(wc -c < "$lib")
          echo "libpes17.so: $size bytes"
          # The recompiled guest code is tens of megabytes; a placeholder is not.
          [ "$size" -gt 20000000 ] || fail "libpes17.so is only $size bytes -- that is not the recompiled runtime"

          # 16 KB page alignment of the library and of its zip entries.
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          tools/verify_android_libs.sh "$lib" "$apk"

          # The trace must be in the shipped library, not only in the source tree.
          grep -a -q 'PES17_TRACE_CAREER' "$lib" || fail "the career trace switch is not in libpes17.so (built without diagnostics?)"
          grep -a -q 'career %lld %s' "$lib" || fail "the career trace formatter is not in libpes17.so"

          cache=$(find android/app/.cxx -name CMakeCache.txt -exec grep -l 'PES17_DIAGNOSTICS:BOOL=ON' {} + 2>/dev/null | head -1 || true)
          if [ -n "$cache" ]; then
            echo "diagnostics: ON ($cache)"
          else
            echo "::warning::No CMakeCache with PES17_DIAGNOSTICS:BOOL=ON found under android/app/.cxx; the string checks above are the evidence."
          fi

          buildtools=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1 || true)
          if [ -n "$buildtools" ] && [ -x "$buildtools/aapt2" ]; then
            "$buildtools/aapt2" dump badging "$apk" | head -3
            "$buildtools/aapt2" dump badging "$apk" | grep -Fq "($PES17_BUILD_SHA" \
              || fail "versionName does not carry the build sha ($PES17_BUILD_SHA)"
          fi
          if [ -n "$buildtools" ] && [ -x "$buildtools/apksigner" ]; then
            "$buildtools/apksigner" verify --print-certs "$apk" | head -8
          fi

          apk_sha=$(sha256sum "$apk" | cut -d' ' -f1)

          mkdir -p build-info
          {
            echo "PES 2017 Android debug APK -- career trace build"
            echo "commit:       $(git rev-parse HEAD)  ($(git rev-parse --abbrev-ref HEAD))"
            echo "career:       29fd9ca 70eabb6 76b0255 (all ancestors of HEAD)"
            echo "default.xex:  $EXPECTED_XEX_SHA (Europe retail, verified at download)"
            echo "diagnostics:  ON -- required for PES17_TRACE_CAREER"
            echo "apk:          $apk ($(wc -c < "$apk") bytes)"
            echo "apk sha256:   $apk_sha"
            echo "libpes17.so:  $size bytes"
            echo "trace:        PES17_TRACE_CAREER and 'career %lld %s' found in the packaged library"
            echo "install:      adb install -r $apk"
            echo "              (debug key: a fresh device, or uninstall first -- uninstalling"
            echo "               deletes Android/data/com.pes2017.recomp, game files and saves)"
            echo "trace on:     adb shell \"echo 1 > /sdcard/Android/data/com.pes2017.recomp/files/career_trace\""
            echo "trace off:    adb shell rm /sdcard/Android/data/com.pes2017.recomp/files/career_trace"
            echo "log:          adb pull /sdcard/Android/data/com.pes2017.recomp/files/game.log"
          } | tee build-info/apk-info.txt

          {
            echo "### app-debug.apk (not published as an artifact)"
            echo ""
            echo '```'
            cat build-info/apk-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deliver the APK to Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.PES17_DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.PES17_DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.PES17_DROPBOX_REFRESH_TOKEN }}
          DROPBOX_DIR: ${{ vars.PES17_DROPBOX_DIR || '/PES17-Builds' }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          apk=android/app/build/outputs/apk/debug/app-debug.apk
          info=build-info/apk-info.txt
          [ -f "$apk" ] || fail "There is no APK to deliver."
          for v in DROPBOX_APP_KEY DROPBOX_APP_SECRET DROPBOX_REFRESH_TOKEN; do
            [ -n "${!v:-}" ] || fail "$v is empty. Add the Dropbox secrets listed at the top of this workflow."
          done

          resp=$(curl -sS -X POST https://api.dropboxapi.com/oauth2/token \
            --data-urlencode grant_type=refresh_token \
            --data-urlencode refresh_token="$DROPBOX_REFRESH_TOKEN" \
            --data-urlencode client_id="$DROPBOX_APP_KEY" \
            --data-urlencode client_secret="$DROPBOX_APP_SECRET" \
            || true)
          token=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
          if [ -z "$token" ]; then
            why=$(printf '%s' "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("error_description") or d.get("error") or "no access_token")' 2>/dev/null || echo "unreadable response")
            fail "Dropbox refused the credential: $why"
          fi

          dir=${DROPBOX_DIR%/}
          name="pes17-app-debug-${PES17_BUILD_SHA}-run${GITHUB_RUN_NUMBER}-${PES17_BUILD_STAMP}.apk"
          dest="$dir/$name"
          total=$(wc -c < "$apk")

          # Chunked session upload: a single /files/upload call stops at 150 MB,
          # and the recompiled library can exceed that.
          chunks="$RUNNER_TEMP/dropbox-chunks"
          rm -rf "$chunks"; mkdir -p "$chunks"
          split -b 33554432 -d -a 4 "$apk" "$chunks/part-"

          sid=$(curl -sS -X POST https://content.dropboxapi.com/2/files/upload_session/start \
                  -H "Authorization: Bearer $token" \
                  -H 'Content-Type: application/octet-stream' \
                  -H 'Dropbox-API-Arg: {"close":false}' \
                  --data-binary '' \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("session_id",""))' 2>/dev/null || true)
          [ -n "$sid" ] || fail "Dropbox would not start an upload session (does the app have files.content.write?)."

          off=0
          parts=("$chunks"/part-*)
          last=$(( ${#parts[@]} - 1 ))
          out=''
          for i in "${!parts[@]}"; do
            p=${parts[$i]}
            sz=$(wc -c < "$p")
            if [ "$i" -eq "$last" ]; then
              arg=$(python3 -c 'import json,sys; print(json.dumps({"cursor":{"session_id":sys.argv[1],"offset":int(sys.argv[2])},"commit":{"path":sys.argv[3],"mode":"add","autorename":True,"mute":False}}))' "$sid" "$off" "$dest")
              out=$(curl -sS -X POST https://content.dropboxapi.com/2/files/upload_session/finish \
                      -H "Authorization: Bearer $token" \
                      -H 'Content-Type: application/octet-stream' \
                      -H "Dropbox-API-Arg: $arg" \
                      --data-binary @"$p") || fail "The last Dropbox chunk failed."
            else
              arg=$(python3 -c 'import json,sys; print(json.dumps({"cursor":{"session_id":sys.argv[1],"offset":int(sys.argv[2])},"close":False}))' "$sid" "$off")
              curl -sS -o /dev/null -X POST https://content.dropboxapi.com/2/files/upload_session/append_v2 \
                -H "Authorization: Bearer $token" \
                -H 'Content-Type: application/octet-stream' \
                -H "Dropbox-API-Arg: $arg" \
                --data-binary @"$p" || fail "The Dropbox chunk at offset $off failed."
            fi
            off=$(( off + sz ))
            printf '  uploaded %s / %s bytes\n' "$off" "$total"
          done

          meta=$(printf '%s' "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("path_display","")); print(d.get("size",0))' 2>/dev/null || true)
          upath=$(printf '%s\n' "$meta" | sed -n 1p)
          usize=$(printf '%s\n' "$meta" | sed -n 2p)
          [ -n "$upath" ] || fail "Dropbox did not confirm the upload: $(printf '%s' "$out" | head -c 400)"
          [ "$usize" = "$total" ] || fail "Dropbox stored $usize bytes but the APK is $total bytes."

          iarg=$(python3 -c 'import json,sys; print(json.dumps({"path":sys.argv[1],"mode":"add","autorename":True,"mute":True}))' "$dest.txt")
          curl -sS -o /dev/null -X POST https://content.dropboxapi.com/2/files/upload \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/octet-stream' \
            -H "Dropbox-API-Arg: $iarg" \
            --data-binary @"$info" || fail "The APK was delivered but its info file was not."

          rm -rf "$chunks"
          {
            echo "### APK delivered to Dropbox"
            echo ""
            echo "- path: \`$upath\`"
            echo "- size: $usize bytes, sha256 \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "- info: \`$dest.txt\`"
            echo ""
            echo "Private: it is in your own Dropbox account and no shared link was"
            echo "created. Open the Dropbox app on the phone to download it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "delivered: $upath ($usize bytes)"

      - name: Clean up the game files
        if: always()
        run: |
          set -uo pipefail
          rm -rf pes ppc build-tests build-android verify-apk build-info \
                 third_party/XenonRecomp/build "$PES17_GAME" "$RUNNER_TEMP/dropbox-chunks"
